# Единый CI-пайплайн Keyboard Layout Cleaner
#
# Jobs:
#   lint        — ruff check (единственный согласованный линтер проекта)
#   mypy        — статический анализ типов (Python 3.12)
#   test        — юнит-тесты на матрице Python 3.10/3.11/3.12 + coverage (порог 50%)
#   test-live   — live-тесты с реальным реестром (sandbox-ключ)
#   build       — сборка PyInstaller (release / main)
#   build-release — ZIP + загрузка asset в GitHub Release
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  release:
    types: [published]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run ruff
        run: python -m ruff check .

  mypy:
    name: Mypy (types)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run mypy
        # Типизация: mypy работает и в pre-commit (на стороне автора),
        # и в CI (на стороне мейнтейнера) — так ошибки не проскальзывают.
        # Передаём файлы явно: flat-структура с __main__.py конфликтует
        # при рекурсивном сканировании (.).
        run: python -m mypy main.py mutex.py scanner.py cleaner.py config.py winproc.py applog.py i18n.py gui_widgets.py ui_theme.py layout_ids.py winapi.py backup.py mutate.py langlist.py settings.py ddu.py

  test:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run unit tests with coverage
        # Автоотбор вместо ручного списка файлов: -m "not live" гарантирует,
        # что каждый новый тест-файл попадает в пайплайн по умолчанию
        # (раньше test_mutex_is_elevate.py выпадал из прогона без сигнала).
        # fail_under вынесен в pyproject.toml — проверяется автоматически.
        run: |
          python -m pytest -m "not live" -v --tb=short --cov --cov-report=term-missing:skip-covered --cov-report=xml
      - name: Check per-module coverage invariants (FIX-23)
        # coverage не умеет порог «модуль не ниже общего», а для cleaner.py
        # (который пишет в реестр) это и есть нужный критерий.
        run: python scripts/check_coverage.py
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

  test-live:
    name: Live tests (sandbox registry)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run live sandbox tests
        # ВАЖНО: live-тесты проверяют работу с РЕАЛЬНЫМИ ветками (read-only,
        # запись — только в тестовый ключ HKCU\Software\KeyboardCleanerTest).
        # SANDBOX_MODE=1 исказил бы plan/delete API и сломал бы assertions.
        run: python -m pytest test_sandbox.py -m live -v --tb=short

  build:
    name: Build (PyInstaller)
    runs-on: windows-latest
    needs: [lint, mypy, test]
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build executable
        run: python -m PyInstaller keyboard_cleaner.spec --noconfirm --clean
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeyboardLayoutCleaner
          path: dist/KeyboardLayoutCleaner/
          retention-days: 7

  build-release:
    name: Build Release Assets
    runs-on: windows-latest
    needs: [lint, mypy, test]
    if: github.event_name == 'release'
    # GITHUB_TOKEN по умолчанию read-only: без contents: write
    # softprops/action-gh-release не может загрузить ZIP-ассет
    # ("Resource not accessible by integration").
    permissions:
      contents: write
    # Секреты прокидываются на уровень job: в if шага доступен только
    # env-контекст, а не secrets.
    env:
      WIN_CERT_PFX: ${{ secrets.WIN_CERT_PFX }}
      WIN_CERT_PASS: ${{ secrets.WIN_CERT_PASS }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build executable
        run: python -m PyInstaller keyboard_cleaner.spec --noconfirm --clean
      - name: Sign executable (optional — only when cert secrets configured)
        # Без сертификата SmartScreen будет предупреждать — это ожидаемо для
        # Open Source без подписки. Шаг активируется автоматически, если в
        # репозитории заданы секреты WIN_CERT_PFX (base64 .pfx) и WIN_CERT_PASS.
        if: env.WIN_CERT_PFX != '' && env.WIN_CERT_PASS != ''
        run: |
          # FIX-38: signtool.exe не обязательно в PATH. Он приезжает с Windows
          # SDK в «Program Files (x86)\Windows Kits\10\bin\<версия>\x64», и на
          # разных образах runner'а он то в PATH, то нет. Без этого поиска
          # шаг падал бы с «signtool.exe не найден» ПОСЛЕ сборки — то есть
          # релиз без архива и без подписи, а человек узнал бы об этом по
          # факту, уже потратив сертификат.
          $sdkBin = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Directory -ErrorAction SilentlyContinue |
            Where-Object { Test-Path (Join-Path $_.FullName 'x64\signtool.exe') } |
            Sort-Object Name -Descending |
            Select-Object -First 1
          if ($sdkBin) { $env:PATH = "$($sdkBin.FullName)\x64;$env:PATH" }
          if (-not (Get-Command signtool.exe -ErrorAction SilentlyContinue)) {
            Write-Error "signtool.exe не найден: на раннере нет Windows SDK. Подпись обязательна (секреты заданы) - релиз не публикуется, чтобы не вышло неподписанной сборки."
            exit 1
          }
          python -c "import base64, os; open('cert.pfx', 'wb').write(base64.b64decode(os.environ['WIN_CERT_PFX']))"
          python sign_exe.py --exe "dist\KeyboardLayoutCleaner\KeyboardLayoutCleaner.exe" --pfx cert.pfx --pfx-pass "$env:WIN_CERT_PASS" --tsa-url https://timestamp.digicert.com
          # FIX-39: `signtool verify /pa` для самоподписанного сертификата
          # честно возвращает «цепочка прервана на недоверенном корне», и
          # обойти это можно только вписав корень в хранилище доверия.
          # Проверено: `certutil -addstore -user Root` на раннере ВИСИТ без
          # диалога подтверждения, то есть такой шаг просто повесил бы
          # релиз. Поэтому доверие и целостность разнесены: целостность
          # подписи проверяет sign_exe.py (подпись есть, файл не менялся), а
          # доверие к издателю для самоподписанного сертификата отсутствует по
          # определению и объявляется предупреждением в логе, а не замалчивается.
          # Для сертификата коммерческого УЦ (Subject != Issuer) флаг не
          # добавляется и проверка остаётся строгой.
          $verifyArgs = @('--exe', 'dist\KeyboardLayoutCleaner\KeyboardLayoutCleaner.exe', '--verify')
          # Get-PfxCertificate -FilePath СПРАШИВАЕТ пароль PFX интерактивно.
          # На раннере ответа нет, и шаг висит до таймаута job'а: проверено
          # 29.09.2026 — локально тот же вызов печатает «Введите пароль:» и
          # не возвращает управление. Читаем сертификат неинтерактивно,
          # отдавая пароль явно.
          $pfxCert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2('cert.pfx', $env:WIN_CERT_PASS)
          if ($pfxCert.Subject -eq $pfxCert.Issuer) {
            Write-Host "::warning title=Самоподписанный сертификат::Subject=Issuer=$($pfxCert.Subject). Подпись будет проверена на целостность, но доверия к издателю у неё нет: SmartScreen и пользователи по-прежнему покажут 'Неизвестный издатель'. Для настоящего доверия нужен сертификат коммерческого УЦ."
            $verifyArgs += '--allow-untrusted'
          }
          Write-Host ("Отпечаток сертификата: {0} (действует до {1})" -f $pfxCert.Thumbprint, $pfxCert.NotAfter)
          python sign_exe.py @verifyArgs
          Remove-Item cert.pfx
      - name: Create ZIP archive
        run: |
          $tag = "${{ github.event.release.tag_name }}".TrimStart("v")
          $zip = "KeyboardLayoutCleaner-$tag-portable.zip"
          # С папкой, а не её содержимым: так же, как в BUILD.md и в v1.1.0 —
          # распаковка даёт каталог KeyboardLayoutCleaner\, и именно такой
          # путь до EXE описан в README (для онлайн-проверки и для хеша).
          Compress-Archive -Path "dist\KeyboardLayoutCleaner" -DestinationPath $zip
          "ARCHIVE=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: "Checksums: compute"
        # Считаем здесь, на checkout'е тега, и кладём таблицу во временную
        # папку: README правится в ветке по умолчанию, а скрипт после смены
        # ветки мог бы отсутствовать (см. шаг ниже).
        run: >
          python scripts/release_hashes.py compute
          --archive "$env:ARCHIVE"
          --tag "${{ github.event.release.tag_name }}"
          --out "$env:RUNNER_TEMP\release-table.md"
      - name: "Checksums: publish to release notes"
        # Идёт ДО загрузки файлов: если упадёт, релиз уже собран, а
        # недописанные хеши — это дефект, который надо увидеть сразу.
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          python scripts/release_hashes.py notes
          --tag "${{ github.event.release.tag_name }}"
          --table "$env:RUNNER_TEMP\release-table.md"
          --notes-file "$env:RUNNER_TEMP\notes.md"
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            KeyboardLayoutCleaner-*-portable.zip
            SHA256SUMS.txt
      - name: Publish checksums to README
        run: |
          # Ветка по умолчанию, а не тег: checkout на событии release смотрит
          # на ТЕГ, и коммит в теге — это либо отказ, либо новый тег.
          git fetch --depth=1 origin "${{ github.event.repository.default_branch }}"
          git checkout -B "${{ github.event.repository.default_branch }}" FETCH_HEAD
          if (-not (Test-Path "scripts\release_hashes.py")) {
            # Релиз поставили с тега, который ещё не влит в ветку по
            # умолчанию: забираем сам скрипт из тега, автоатика не теряется.
            git checkout "${{ github.event.release.tag_name }}" -- scripts/release_hashes.py
          }
          python scripts/release_hashes.py readme --tag "${{ github.event.release.tag_name }}" --table "$env:RUNNER_TEMP\release-table.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "docs: SHA256 релиза $env:ARCHIVE обновлён автоматически"
            # Явный remote и ветка: checkout -B создал ветку из FETCH_HEAD
            # БЕЗ upstream, и голый `git push` падал с «The current branch
            # main has no upstream branch» (FIX-35). Коммит при этом уже
            # был создан — хеши молча не попадали в README, а шаг падал.
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          }