# Единый CI-пайплайн Keyboard Layout Cleaner
#
# Jobs:
#   lint        — ruff check (единственный согласованный линтер проекта)
#   test        — юнит-тесты на матрице Python 3.10/3.11/3.12 + coverage
#   test-live   — live-тесты с реальным реестром (sandbox-ключ)
#   build       — сборка PyInstaller (release / main)
#   build-release — ZIP + загрузка asset в GitHub Release
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  release:
    types: [published]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run ruff
        run: python -m ruff check .

  test:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run unit tests with coverage
        run: |
          python -m pytest test_applog.py test_elevation.py test_mutex_restart.py test_restart_integration.py test_scanner.py -v --tb=short --cov --cov-report=term-missing:skip-covered --cov-report=xml
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

  test-live:
    name: Live tests (sandbox registry)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run live sandbox tests
        # ВАЖНО: live-тесты проверяют работу с РЕАЛЬНЫМИ ветками (read-only,
        # запись — только в тестовый ключ HKCU\Software\TestLayoutCleaner).
        # SANDBOX_MODE=1 исказил бы plan/delete API и сломал бы assertions.
        run: python -m pytest test_sandbox.py -m live -v --tb=short

  build:
    name: Build (PyInstaller)
    runs-on: windows-latest
    needs: [lint, test]
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build executable
        run: python -m PyInstaller keyboard_cleaner.spec --noconfirm --clean
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeyboardLayoutCleaner
          path: dist/KeyboardLayoutCleaner/
          retention-days: 7

  build-release:
    name: Build Release Assets
    runs-on: windows-latest
    needs: [lint, test]
    if: github.event_name == 'release'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build executable
        run: python -m PyInstaller keyboard_cleaner.spec --noconfirm --clean
      - name: Create ZIP archive
        run: |
          $tag = "${{ github.event.release.tag_name }}".TrimStart("v")
          Compress-Archive -Path "dist\KeyboardLayoutCleaner\*" -DestinationPath "KeyboardLayoutCleaner_$tag.zip"
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: KeyboardLayoutCleaner_*.zip