[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keyboard-layout-cleaner"
version = "1.0.5"
description = "GUI-утилита для поиска и безопасного удаления фантомных раскладок клавиатуры в Windows"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Keyboard Layout Cleaner Contributors" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = [
    "customtkinter>=5.2.0",
]

# ВАЖНО: `pip install .` НЕ является поддерживаемым способом установки.
# Приложение — портативная GUI-утилита для Windows; данные (locales/*.json,
# scripts/*.ps1, assets/) не упаковываются в site-packages при flat-сборке,
# поэтому консольный entry-point был бы неработоспособен. Поддерживаемые
# способы запуска: из исходников (python main.py) или собранный .exe.
# [project.scripts]
# keyboard-layout-cleaner = "main:main"

[tool.pytest.ini_options]
testpaths = ["."]
# Локальная распакованная копия релиза не является вторым набором тестов.
norecursedirs = [".*", "build", "dist", "venv", "__pycache__", "KeyboardLayoutCleaner"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "gui: тесты GUI (требуют event loop, могут зависнуть в CI)",
    "live: тесты с реальным реестром (sandbox)",
]

[tool.coverage.run]
source = [
    "main",
    "mutex",
    "scanner",
    "cleaner",
    "config",
    "winproc",
    "applog",
    "i18n",
    "gui_widgets",
    "ui_theme",
]
omit = ["*/conftest.py", "*/test_*.py", "*/__init__.py"]

[tool.coverage.report]
fail_under = 50

[tool.setuptools]
# Плоский модульный layout: явно перечисляем модули приложения, чтобы
# ``pip install .`` не собирал в пакет тесты/локали/assets.
py-modules = [
    "main",
    "mutex",
    "scanner",
    "cleaner",
    "config",
    "applog",
    "winproc",
    "i18n",
    "gui_widgets",
    "ui_theme",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
strict_optional = true
# Flat-структура: __init__.py / __main__.py в корне конфликтуют с проверкой «.»
# как модуля. Исключаем их и тесты/скрипты.
exclude = ["test_", "scripts/", "__init__\\.py$", "__main__\\.py$"]