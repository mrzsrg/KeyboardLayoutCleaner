[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keyboard-layout-cleaner"
version = "1.0.0"
description = "GUI-утилита для поиска и безопасного удаления фантомных раскладок клавиатуры в Windows"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Keyboard Layout Cleaner Contributors" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = [
    "customtkinter>=5.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pyinstaller>=6.0",
]

[project.scripts]
keyboard-layout-cleaner = "main:main"

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "gui: тесты GUI (требуют event loop, могут зависнуть в CI)",
    "live: тесты с реальным реестром (sandbox)",
]

[tool.coverage.run]
source = [
    "main",
    "scanner",
    "cleaner",
    "config",
    "winproc",
    "applog",
    "i18n",
    "gui_widgets",
    "ui_theme",
]
omit = ["*/conftest.py", "*/test_*.py", "*/__init__.py"]

[tool.setuptools]
# Плоский модульный layout: явно перечисляем модули приложения, чтобы
# ``pip install .`` не собирал в пакет тесты/локали/assets.
py-modules = [
    "main",
    "scanner",
    "cleaner",
    "config",
    "applog",
    "winproc",
    "i18n",
    "gui_widgets",
    "ui_theme",
]